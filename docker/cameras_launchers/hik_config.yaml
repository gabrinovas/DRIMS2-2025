hik_camera:
  ros__parameters:
    device: "HIK"            # Camera device identifier (can be "HIK" or a serial number)
    width: 1920              # Image width in pixels
    height: 1080             # Image height in pixels
    frame_rate: 30.0         # Frames per second
    pixel_format: "BGR8"     # Pixel format for output images
    exposure_auto: "Off"     # Exposure mode: "Off", "Once", or "Continuous"
    exposure_time: 50000.0   # Exposure time in microseconds
    gain_auto: "Off"         # Gain mode: "Off", "Once", or "Continuous"
    gain: 16.0               # Gain value